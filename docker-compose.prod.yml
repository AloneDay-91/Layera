services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No "ports:" mapping — only reachable from other containers on this
    # compose network, never from the host or the internet.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    # No "ports:" mapping either. File uploads go through Next.js
    # (`/api/uploads/[id]`) unless S3_PUBLIC_ENDPOINT is set and MinIO is
    # reverse-proxied. For ad-hoc console access, use an SSH tunnel:
    #   ssh -L 9011:localhost:9001 <prod-host>

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      # Bound to loopback only, on a port distinct from the dev stack's
      # 3000 — never reachable directly from outside this host. Point your
      # HTTPS reverse proxy (nginx/Caddy) at 127.0.0.1:3001.
      - "127.0.0.1:3001:3000"
    depends_on:
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data:
