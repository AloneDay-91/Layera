name: Dependency audit fix

# Weekly, plus on-demand: tries `pnpm audit --fix` and opens a PR with
# whatever it managed to fix. Never pushes to main directly — a human
# reviews and merges (or closes) the PR.
on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix:
    name: pnpm audit --fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record vulnerabilities before fixing
        run: pnpm audit || true

      - name: Attempt automatic fix
        run: pnpm audit --fix || true

      - name: Verify the fixed tree still installs, lints, and builds
        run: |
          pnpm install --no-frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm build
        env:
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
          S3_ENDPOINT: minio
          S3_ACCESS_KEY: ci-placeholder
          S3_SECRET_KEY: ci-placeholder
          S3_BUCKET: filecloud

      - name: Open pull request with the fix
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: pnpm audit --fix"
          title: "chore: pnpm audit --fix"
          body: |
            Automated weekly dependency audit.

            `pnpm audit --fix` ran against the current lockfile and this PR
            contains whatever it was able to resolve within existing semver
            ranges. Lint, typecheck, and build were re-verified against the
            result before opening this PR — still review the diff and the
            remaining `pnpm audit` output (in the job log) before merging,
            since some vulnerabilities may need a manual major-version bump.
          branch: chore/pnpm-audit-fix
          delete-branch: true
          labels: dependencies, security
