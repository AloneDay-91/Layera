name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # The web build doesn't hit a live DB/S3, but a couple of modules
          # read these env vars at import time — dummy values keep the
          # build hermetic and independent of any real secret.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          BETTER_AUTH_URL: http://localhost:3000
          S3_ENDPOINT: minio
          S3_ACCESS_KEY: ci-placeholder
          S3_SECRET_KEY: ci-placeholder
          S3_BUCKET: filecloud

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (fails on high/critical)
        run: pnpm audit --audit-level=high

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: filecloud
          POSTGRES_PASSWORD: filecloud
          POSTGRES_DB: filecloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filecloud -d filecloud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://filecloud:filecloud@localhost:5432/filecloud
      BETTER_AUTH_SECRET: ci-test-placeholder-not-a-real-secret
      BETTER_AUTH_URL: http://localhost:3000
      S3_ENDPOINT: minio
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder
      S3_BUCKET: filecloud
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm db:migrate

      - name: Test
        run: pnpm test
